<title>SF6 大赛追踪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --ink:#171A26; --muted:#5E6478; --line:#DCDFE8;
  --accent:#D92A63; --accent-soft:#FBE3EB; --cobalt:#2F5BD0; --cobalt-soft:#E3EAFB;
  --live:#0F8F5C; --live-soft:#DDF3E9; --warn:#A86A00; --warn-soft:#FBEFD6;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11131A; --surface:#1A1D28; --ink:#ECEEF5; --muted:#9AA0B4; --line:#2A2E3D;
    --accent:#FF5C8D; --accent-soft:#3A1A27; --cobalt:#7C9CFF; --cobalt-soft:#1C2645;
    --live:#3DD598; --live-soft:#113327; --warn:#F2B64B; --warn-soft:#3A2C10;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11131A; --surface:#1A1D28; --ink:#ECEEF5; --muted:#9AA0B4; --line:#2A2E3D;
  --accent:#FF5C8D; --accent-soft:#3A1A27; --cobalt:#7C9CFF; --cobalt-soft:#1C2645;
  --live:#3DD598; --live-soft:#113327; --warn:#F2B64B; --warn-soft:#3A2C10;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{margin:0;text-wrap:balance}
.masthead{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,64px);line-height:.95;letter-spacing:.01em}
h1 .cn{font-family:var(--body);font-weight:800;font-size:.62em;letter-spacing:0;margin-left:.2em}
h1 .slash{color:var(--accent)}
.updated{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-width:65ch}
.brief b{color:var(--accent);font-weight:700;margin-right:6px}

.next{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:20px 22px;position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border:14px solid var(--accent);border-radius:50%;opacity:.35}
.next .count{font-family:var(--display);font-size:72px;line-height:.9;color:var(--accent)}
.next .count small{font-family:var(--body);font-size:15px;font-weight:700;color:var(--bg);margin-left:4px}
.next .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.next .nm{font-size:20px;font-weight:800;line-height:1.3}
.next .sub{font-size:13px;opacity:.8}
.next > *{position:relative;z-index:1}

.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.next:not([hidden]) + .road{margin-top:-18px}
.rd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:0}
.rd.nodate{grid-template-columns:1fr}
.rd .rc{font-family:var(--display);font-size:40px;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.rd .rc small{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.rd.bal .rc{color:var(--cobalt)}
.rd .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rd .nm{font-size:17px;font-weight:800;line-height:1.3;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.rd a.nm:hover{color:var(--accent)}
.rd .sub{font-size:13px;color:var(--muted)}

section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
h2{font-size:18px;font-weight:800}
h2 .en{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em;margin-right:8px;color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:108px 1fr minmax(0,230px);gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.date{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;line-height:1.35}
.date .y{color:var(--muted);font-size:11px}
.title{display:flex;flex-direction:column;gap:4px;min-width:0}
.title .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title a,.title .n{font-weight:700;font-size:16px;color:var(--ink);text-decoration:none}
.title a:hover{color:var(--accent)}
.meta{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:60ch}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:1px 8px;border-radius:4px;white-space:nowrap}
.k-premier{background:var(--accent-soft);color:var(--accent)}
.k-major,.k-invitational,.k-team{background:var(--cobalt-soft);color:var(--cobalt)}
.k-final{background:var(--ink);color:var(--bg)}
.k-online{background:var(--line);color:var(--muted)}
.st{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st-live{background:var(--live-soft);color:var(--live)}
.st-up{background:var(--warn-soft);color:var(--warn)}
.st-pending{background:var(--line);color:var(--muted)}
.res{display:flex;flex-direction:column;gap:2px;font-size:13px}
.res .champ{font-weight:800;font-size:15px}
.res .champ::before{content:"1ST";font-family:var(--mono);font-size:10px;font-weight:600;color:var(--accent);margin-right:6px;letter-spacing:.06em}
.res .ru::before{content:"2ND";font-family:var(--mono);font-size:10px;color:var(--muted);margin-right:6px;letter-spacing:.06em}
.res .ch{color:var(--muted);font-weight:400}
.res .score{font-family:var(--mono);font-size:12px;color:var(--muted)}

.meter{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.q-note{font-size:13px;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.q .p{font-weight:800}
.q .via{font-size:12px;color:var(--muted)}
.q.tbd .p{color:var(--muted);font-weight:600}

.watch{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding:8px 10px;border-radius:8px;background:var(--cobalt-soft);max-width:60ch}
.watch .wl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt)}
.watch .wr{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;align-items:baseline}
.watch .wt{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.watch .est{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px}
.watch .wn{font-size:12px;color:var(--muted)}
.next .jst{font-family:var(--mono);font-size:13px;margin-top:6px}
.next .jst b{color:var(--accent);font-weight:600}
.log{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:92px 1fr;gap:12px;font-size:14px}
.log time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.empty,.notice{color:var(--muted);font-size:14px;padding:12px 0}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--muted)}

@media (max-width:640px){
  .ev{grid-template-columns:1fr;gap:6px}
  .date{display:flex;gap:8px;align-items:baseline}
  .next{grid-template-columns:1fr;gap:8px}
  .next .count{font-size:60px}
  .log li{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:no-preference){ .ev{transition:background .15s} }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">Street Fighter 6 · Capcom Pro Tour 2026 赛季</div>
    <h1>SF6 <span class="slash">/</span> MAJORS<span class="cn">大赛追踪</span></h1>
    <div class="updated" id="updated">正在读取数据…</div>
    <div class="brief" id="brief" hidden></div>
  </header>

  <div class="next" id="next" hidden></div>

  <div class="road" id="road" role="group" aria-label="角色追加与版本调整" hidden></div>

  <section aria-labelledby="h-sched">
    <div class="sechead">
      <h2 id="h-sched"><span class="en">SCHEDULE</span>赛程与结果</h2>
      <div class="filters" role="group" aria-label="筛选">
        <button type="button" id="f-all" data-f="all" aria-pressed="true">全部</button>
        <button type="button" id="f-premier" data-f="premier" aria-pressed="false">CPT Premier</button>
        <button type="button" id="f-up" data-f="up" aria-pressed="false">未结束</button>
      </div>
    </div>
    <div class="list" id="upcoming"></div>
    <div class="list" id="past"></div>
  </section>

  <section aria-labelledby="h-cc">
    <div class="sechead">
      <h2 id="h-cc"><span class="en">CAPCOM CUP 13</span>已确认名额</h2>
      <span class="updated" id="ccCount"></span>
    </div>
    <div class="meter" aria-hidden="true"><i id="ccBar" style="width:0%"></i></div>
    <div class="q-note" id="ccNote"></div>
    <div class="qgrid" id="ccList"></div>
  </section>

  <section aria-labelledby="h-log">
    <div class="sechead"><h2 id="h-log"><span class="en">LOG</span>更新日志</h2></div>
    <ul class="log" id="log"></ul>
  </section>

  <footer id="foot">数据来自 Capcom Pro Tour 官网、Liquipedia、start.gg 与各赛事报道，每周一、周四早上由 Claude 检索后自动更新。时间均按日本时间 (JST) 计算。</footer>
</div>

<script>
(function(){
  const $ = (s) => document.querySelector(s);
  const KIND = {premier:"CPT Premier", major:"Major", invitational:"邀请赛", team:"团体赛", final:"总决赛", online:"线上"};
  let events = [], status = null, filter = "all";

  function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=String(text); return e; }
  function todayJST(){ return new Date(Date.now()+9*3600e3).toISOString().slice(0,10); }
  function days(a,b){ return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5); }
  function md(d){ return d ? d.slice(5).replace("-", ".") : ""; }
  function stateOf(ev){
    if (ev.status === "cancelled") return "cancelled";
    const t = todayJST(), s = ev.start, e = ev.end || ev.start;
    if (!s) return "up";
    if (t < s) return "up";
    if (t <= e) return "live";
    return ev.champion ? "done" : "pending";
  }

  function watchBox(ev){
    const w = el("div","watch");
    w.append(el("div","wl","日本时间观赛"));
    ev.watch.forEach(x=>{
      const r = el("div","wr");
      r.append(el("span","wt", x.when||"待公布"), el("span",null, x.what||""));
      if (x.tentative) r.append(el("span","est","预估"));
      w.append(r);
    });
    if (ev.stream) w.append(el("div","wn","直播：" + ev.stream));
    if (ev.watchNote) w.append(el("div","wn", ev.watchNote));
    return w;
  }

  function row(ev){
    const st = stateOf(ev);
    const r = el("div","ev");
    const d = el("div","date");
    d.append(el("div",null, md(ev.start) + (ev.end && ev.end!==ev.start ? "–"+md(ev.end) : "")));
    d.append(el("div","y", (ev.start||"").slice(0,4)));
    r.append(d);

    const t = el("div","title");
    const r1 = el("div","row1");
    if (ev.link && /^https:\/\//.test(ev.link)){ const a=el("a",null,ev.name); a.href=ev.link; a.target="_blank"; a.rel="noopener"; r1.append(a); }
    else r1.append(el("span","n",ev.name));
    r1.append(el("span","chip k-"+(KIND[ev.kind]?ev.kind:"major"), KIND[ev.kind]||ev.kind||"Major"));
    if (st==="live") r1.append(el("span","st st-live","进行中"));
    if (st==="up") { const n=days(todayJST(), ev.start); r1.append(el("span","st st-up", n<=0?"即将开始":"还有 "+n+" 天")); }
    if (st==="pending") r1.append(el("span","st st-pending","结果待更新"));
    t.append(r1);
    const bits = [ev.city, ev.venue, ev.entrants ? ev.entrants.toLocaleString("en-US")+" 人参赛" : null, ev.prize].filter(Boolean);
    if (bits.length) t.append(el("div","meta", bits.join(" · ")));
    if (ev.note) t.append(el("div","note", ev.note));
    if (st!=="done" && st!=="pending" && Array.isArray(ev.watch) && ev.watch.length) t.append(watchBox(ev));
    r.append(t);

    const res = el("div","res");
    if (ev.champion){
      const c = el("div","champ", ev.champion); if (ev.championChar) c.append(el("span","ch"," "+ev.championChar)); res.append(c);
      if (ev.runnerUp){ const u = el("div","ru", ev.runnerUp); if (ev.runnerUpChar) u.append(el("span","ch"," "+ev.runnerUpChar)); res.append(u); }
      if (ev.score) res.append(el("div","score", ev.score));
    } else if (ev.preview) {
      res.append(el("div","score", ev.preview));
    }
    r.append(res);
    return r;
  }

  function render(){
    const up = $("#upcoming"), past = $("#past");
    up.replaceChildren(); past.replaceChildren();
    let list = events.slice();
    if (filter==="premier") list = list.filter(e=>e.kind==="premier");
    const open = list.filter(e=>["up","live"].includes(stateOf(e))).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    const closed = filter==="up" ? [] : list.filter(e=>["done","pending"].includes(stateOf(e))).sort((a,b)=>(b.end||b.start||"").localeCompare(a.end||a.start||""));
    open.forEach(e=>up.append(row(e)));
    closed.forEach(e=>past.append(row(e)));
    if (!open.length && !closed.length) past.append(el("div","empty","暂无符合条件的赛事。"));

    const nx = events.filter(e=>["up","live"].includes(stateOf(e))).sort((a,b)=>(a.start||"").localeCompare(b.start||""))[0];
    const box = $("#next");
    if (nx){
      box.replaceChildren();
      const st = stateOf(nx);
      const c = el("div","count");
      if (st==="live"){ c.textContent = "LIVE"; }
      else { const n = days(todayJST(), nx.start); c.textContent = String(n); c.append(el("small",null,"天")); }
      const info = el("div");
      info.append(el("div","lbl", st==="live" ? "正在进行" : "下一站"));
      info.append(el("div","nm", nx.name));
      info.append(el("div","sub", [md(nx.start)+(nx.end?"–"+md(nx.end):""), nx.city, KIND[nx.kind]].filter(Boolean).join(" · ")));
      if (nx.preview) info.append(el("div","sub", nx.preview));
      const key = Array.isArray(nx.watch) ? (nx.watch.find(x=>x.key) || nx.watch[nx.watch.length-1]) : null;
      if (key){ const j = el("div","jst"); j.append(el("b",null,"JST "+(key.when||"待公布")), document.createTextNode(" · "+(key.what||"")+(key.tentative?"（预估）":""))); info.append(j); }
      box.append(c, info); box.hidden = false;
    } else box.hidden = true;
  }

  function renderRoad(){
    const box = $("#road"), R = (status && status.roadmap) || {};
    const isDate = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d || "");
    const cards = [];
    function card(kind, label, item, fallbackName, verb){
      const has = isDate(item.date);
      const c = el("div", "rd " + kind + (has ? "" : " nodate"));
      if (has){
        const n = days(todayJST(), item.date);
        const rc = el("div","rc");
        if (n > 0){ rc.textContent = String(n); rc.append(el("small",null,"天")); }
        else rc.textContent = n === 0 ? "TODAY" : "OUT";
        c.append(rc);
      }
      const info = el("div");
      info.append(el("div","lbl", label));
      const name = item.name || fallbackName;
      if (item.link && /^https:\/\//.test(item.link)){ const a = el("a","nm",name); a.href=item.link; a.target="_blank"; a.rel="noopener"; info.append(a); }
      else info.append(el("div","nm", name));
      if (has){
        const n = days(todayJST(), item.date);
        const when = md(item.date) + " " + (n > 0 ? verb : n === 0 ? "今天" + verb : "已" + verb);
        info.append(el("div","sub", [when, item.note].filter(Boolean).join(" · ")));
      }
      c.append(info);
      return c;
    }
    if (R.character && R.character.name) cards.push(card("chr", "下一位追加角色", R.character, "", "上线"));
    if (R.balance && isDate(R.balance.date)) cards.push(card("bal", "下次版本调整", R.balance, "平衡性调整", "实装"));
    box.replaceChildren(...cards);
    box.hidden = cards.length === 0;
  }

  function renderStatus(){
    if (!status) return;
    renderRoad();
    $("#updated").textContent = status.lastUpdated ? "最后更新：" + status.lastUpdated + " (JST)" : "";
    const b = $("#brief");
    if (status.brief){ b.replaceChildren(el("b",null,"今日要点"), document.createTextNode(status.brief)); b.hidden=false; } else b.hidden = true;

    const q = Array.isArray(status.qualified) ? status.qualified : [];
    const total = status.totalSlots || 48;
    const confirmed = q.filter(x=>!x.tbd).length;
    $("#ccCount").textContent = confirmed + " / " + total;
    $("#ccBar").style.width = Math.min(100, confirmed/total*100) + "%";
    $("#ccNote").textContent = status.ccNote || "";
    const g = $("#ccList"); g.replaceChildren();
    q.forEach(x=>{ const c=el("div","q"+(x.tbd?" tbd":"")); c.append(el("div","p",x.player), el("div","via",x.via||"")); g.append(c); });

    const lg = $("#log"); lg.replaceChildren();
    const L = Array.isArray(status.log) ? status.log.slice(0,30) : [];
    if (!L.length) lg.append(el("li","empty","暂无记录。"));
    L.forEach(x=>{ const li=el("li"); li.append(el("time",null,x.date||""), el("div",null,x.text||"")); lg.append(li); });
  }

  document.querySelectorAll(".filters button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      filter = btn.dataset.f;
      document.querySelectorAll(".filters button").forEach(b=>b.setAttribute("aria-pressed", String(b===btn)));
      render();
    });
  });

  (async function(){
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db){ $("#updated").textContent = "数据暂时无法加载，请稍后刷新。"; return; }
    db.collection("events").onSnapshot(s=>{ events = s.docs.map(d=>d.data()); render(); },
      ()=>{ $("#updated").textContent = "赛事数据连接中断，请刷新页面。"; });
    db.doc("meta/status").onSnapshot(s=>{ status = s.exists ? s.data() : null; renderStatus(); render(); }, ()=>{});
  })();
})();
</script>
